<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Taskmaster</title>
<style>
:root{--bg:#F3F1EC;--card:#FFFFFF;--ink:#1B1D22;--muted:#6B6E76;--line:#E2DFD8;--acc:#3D63E0;--todo:#3D63E0;--pend:#C9800E;--done:#1E9468;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121316;--card:#1C1E22;--ink:#ECEDEF;--muted:#9A9DA5;--line:#2C2F35;--acc:#5B82FF;--todo:#5B82FF;--pend:#E39B2C;--done:#2FB27E}}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer}
main{max-width:560px;margin:0 auto;padding:12px 14px 40px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
h1{font-size:22px;font-weight:800;margin:0;letter-spacing:-.01em}
.icon{width:40px;height:40px;border:0;background:transparent;color:var(--ink);border-radius:12px;display:grid;place-items:center}
.icon svg{width:22px;height:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.mhead{display:flex;align-items:center;gap:6px}
.mhead b{flex:1;font-size:17px}
.nav{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:18px;line-height:1}
.tbtn{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:6px 12px;font-size:13px}
.wd{display:grid;grid-template-columns:repeat(7,1fr);font-size:11px;font-weight:600;color:var(--muted);text-align:center;margin:10px 0 4px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.d{aspect-ratio:1/1.1;border:0;background:transparent;border-radius:10px;color:var(--ink);display:flex;flex-direction:column;align-items:center;padding:6px 2px 4px;gap:4px}
.d .n{font-size:14px;font-weight:600}
.d.today{box-shadow:inset 0 0 0 1.5px var(--acc)}.d.today .n{color:var(--acc)}
.d.sel{background:var(--acc)}.d.sel .n{color:#fff}
.blank{visibility:hidden}
.bar{display:flex;width:72%;height:4px;border-radius:2px;overflow:hidden;background:var(--line)}
.bd{background:var(--done)}.bp{background:var(--pend)}.bt{background:var(--todo);opacity:.45}
.d.sel .bt{background:#fff;opacity:.6}
.hd{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--done)}.hd.full{background:var(--done)}
.d.sel .hd{border-color:#fff}.d.sel .hd.full{background:#fff}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:8px}
.legend span{display:flex;align-items:center;gap:5px}.legend i{width:10px;height:4px;border-radius:2px;display:inline-block}
.panel{margin-top:12px}
h2{font-size:18px;margin:0 0 4px}
.lbl{font-size:12px;font-weight:600;color:var(--muted);margin:14px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:8px 14px 8px 8px;font-size:14px}
.cb{width:20px;height:20px;border-radius:6px;border:2px solid var(--muted);display:grid;place-items:center;color:#fff;flex:none}
.cb svg{width:14px;height:14px;opacity:0}
.chip.on .cb{background:var(--done);border-color:var(--done)}.chip.on .cb svg{opacity:1}
.add{display:flex;gap:8px}
input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:11px 12px;font:inherit}
.btn{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:0 16px;font-weight:600}
.btn2{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:600}
.tabs{display:flex;gap:6px;margin:12px 0 8px;overflow-x:auto}
.tab{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.task{display:flex;align-items:center;gap:10px;padding:8px 6px 8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.pill{flex:none;border:0;border-radius:999px;padding:5px 0;width:78px;font-size:12px;font-weight:700;color:#fff}
.pill.todo{background:var(--todo)}.pill.pending{background:var(--pend)}.pill.done{background:var(--done)}
.tx{flex:1;word-break:break-word}
.task.done .tx{text-decoration:line-through;color:var(--muted)}
.del{border:0;background:transparent;color:var(--muted);width:34px;height:34px;font-size:20px;border-radius:8px;flex:none}
.empty{color:var(--muted);font-size:14px;padding:8px 2px}
.carry{margin-top:10px;width:100%;border:1.5px dashed var(--pend);color:var(--pend);background:transparent;border-radius:12px;padding:10px;font-weight:600}
.hint{font-size:12px;color:var(--muted);margin-top:8px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet>div{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow:auto}
.shead{display:flex;justify-content:space-between;align-items:center}
.hrow{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
.note{font-size:13px;color:var(--muted);margin:6px 0 10px}
.row{display:flex;gap:8px;flex-wrap:wrap}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style></head><body><main id="app"></main>
<script>
(function(){
var K='tm-v1',S;
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S||!S.tasks)S={tasks:{},ticks:{},habits:[{id:'h1',name:'Gym / MMA'},{id:'h2',name:'Reading'}]};
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function pad(n){return String(n).padStart(2,'0')}
function key(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parse(k){var p=k.split('-');return new Date(+p[0],p[1]-1,+p[2])}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
var LABEL={todo:'To do',pending:'Pending',done:'Done'},NEXT={todo:'pending',pending:'done',done:'todo'};
var CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>';
var GEAR='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>';
var now=new Date(),today=key(now),sel=today,vy=now.getFullYear(),vm=now.getMonth(),filter='all',sheet=false;
var app=document.getElementById('app');
function ticksOn(k){var t=S.ticks[k]||{},n=0;S.habits.forEach(function(h){if(t[h.id])n++});return n}
function counts(list){var c={todo:0,pending:0,done:0};list.forEach(function(t){c[t.status]++});return c}

function calHTML(){
 var first=new Date(vy,vm,1),lead=(first.getDay()+6)%7,n=new Date(vy,vm+1,0).getDate(),h='';
 for(var i=0;i<lead;i++)h+='<span class="d blank"></span>';
 for(var d=1;d<=n;d++){var k=key(new Date(vy,vm,d)),list=S.tasks[k]||[],c=counts(list),ht=ticksOn(k),H=S.habits.length;
  h+='<button class="d'+(k===today?' today':'')+(k===sel?' sel':'')+'" data-k="'+k+'" aria-label="'+d+' '+MONTHS[vm]+', '+list.length+' tasks"><span class="n">'+d+'</span>'
   +(list.length?'<span class="bar"><i class="bd" style="flex:'+c.done+'"></i><i class="bp" style="flex:'+c.pending+'"></i><i class="bt" style="flex:'+c.todo+'"></i></span>':'')
   +(ht?'<span class="hd'+(ht>=H?' full':'')+'"></span>':'')+'</button>'}
 return '<section class="card"><div class="mhead"><button class="nav" data-nav="-1" aria-label="Previous month">&lsaquo;</button><b>'+MONTHS[vm]+' '+vy+'</b><button class="nav" data-nav="1" aria-label="Next month">&rsaquo;</button><button class="tbtn" id="gotoday">Today</button></div>'
  +'<div class="wd"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div><div class="days">'+h+'</div>'
  +'<div class="legend"><span><i style="background:var(--done)"></i>Done</span><span><i style="background:var(--pend)"></i>Pending</span><span><i style="background:var(--todo);opacity:.45"></i>To do</span><span><i style="width:7px;height:7px;border-radius:50%;background:var(--done)"></i>All ticks done</span></div></section>'}

function panelHTML(){
 var d=parse(sel),list=S.tasks[sel]||[],c=counts(list),t=S.ticks[sel]||{};
 var title=d.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'});
 var chips=S.habits.length?S.habits.map(function(h){var on=!!t[h.id];return '<button class="chip'+(on?' on':'')+'" data-h="'+h.id+'" aria-pressed="'+on+'"><span class="cb">'+CHECK+'</span>'+esc(h.name)+'</button>'}).join(''):'<div class="empty">No daily ticks set up. Add some in settings.</div>';
 var shown=list.filter(function(x){return filter==='all'||x.status===filter});
 var rows=shown.length?shown.map(function(x){return '<li class="task '+x.status+'"><button class="pill '+x.status+'" data-id="'+x.id+'">'+LABEL[x.status]+'</button><span class="tx">'+esc(x.text)+'</span><button class="del" data-del="'+x.id+'" aria-label="Delete">&times;</button></li>'}).join('')
  :'<li class="empty">'+(list.length?'Nothing '+(filter==='todo'?'to do':filter)+' here.':'No tasks yet. Add one above.')+'</li>';
 var unfinished=c.todo+c.pending;
 var tabs=[['all','All',list.length],['todo','To do',c.todo],['pending','Pending',c.pending],['done','Done',c.done]].map(function(f){return '<button class="tab'+(filter===f[0]?' on':'')+'" data-f="'+f[0]+'">'+f[1]+' '+f[2]+'</button>'}).join('');
 return '<section class="card panel"><h2>'+title+(sel===today?' <span style="color:var(--acc);font-size:13px">Today</span>':'')+'</h2>'
  +'<div class="lbl">DAILY TICKS</div><div class="chips">'+chips+'</div>'
  +'<div class="lbl">TASKS</div><div class="add"><input id="new" placeholder="Add a task" enterkeyhint="done" autocomplete="off"><button class="btn" id="addbtn">Add</button></div>'
  +'<div class="tabs">'+tabs+'</div><ul class="tasks">'+rows+'</ul>'
  +(list.length?'<div class="hint">Tap a status to change it: To do, Pending, Done.</div>':'')
  +(sel<today&&unfinished?'<button class="carry" id="carry">Move '+unfinished+' unfinished to today</button>':'')+'</section>'}

function sheetHTML(){
 if(!sheet)return '';
 var hab=S.habits.map(function(h){return '<div class="hrow"><span>'+esc(h.name)+'</span><button class="del" data-hdel="'+h.id+'" aria-label="Remove">&times;</button></div>'}).join('');
 var native=!!window.TM,exact=true;try{if(native)exact=window.TM.exactOk()}catch(e){}
 return '<div class="sheet" id="sheetbg"><div role="dialog" aria-label="Settings"><div class="shead"><h2>Settings</h2><button class="icon" id="close" aria-label="Close">&times;</button></div>'
  +'<div class="lbl">DAILY TICKS</div>'+hab+'<div class="add" style="margin-top:10px"><input id="hnew" placeholder="e.g. Read 20 pages" autocomplete="off"><button class="btn" id="hadd">Add</button></div>'
  +'<div class="lbl">REMINDERS</div><div class="note">Every day at 9:00 and 22:00.'+(native&&!exact?' They may arrive a few minutes late until you allow exact timing.':'')+'</div>'
  +(native?'<div class="row"><button class="btn2" id="test">Send test notification</button>'+(!exact?'<button class="btn2" id="exact">Allow exact timing</button>':'')+'</div>':'<div class="note">Reminders work in the installed app.</div>')
  +'</div></div>'}

function render(){
 var y=window.scrollY;
 app.innerHTML='<header class="top"><h1>Taskmaster</h1><button class="icon" id="gear" aria-label="Settings">'+GEAR+'</button></header>'+calHTML()+panelHTML()+sheetHTML();
 window.scrollTo(0,y);
}
function addTask(){var i=document.getElementById('new'),v=i.value.trim();if(!v)return;(S.tasks[sel]=S.tasks[sel]||[]).push({id:uid(),text:v,status:'todo'});save();if(filter==='done'||filter==='pending')filter='all';render();var n=document.getElementById('new');if(n)n.focus()}
function addHabit(){var i=document.getElementById('hnew'),v=i.value.trim();if(!v)return;S.habits.push({id:uid(),name:v});save();render();document.getElementById('hnew').focus()}
function find(id){var l=S.tasks[sel]||[];for(var i=0;i<l.length;i++)if(l[i].id===id)return i;return -1}

app.addEventListener('click',function(e){
 var t=e.target.closest('button,[id=sheetbg]');if(!t)return;
 if(t.id==='sheetbg'){if(e.target===t){sheet=false;render()}return}
 var k=t.getAttribute('data-k');if(k){sel=k;render();return}
 var nv=t.getAttribute('data-nav');if(nv){vm+=+nv;if(vm<0){vm=11;vy--}if(vm>11){vm=0;vy++}render();return}
 var h=t.getAttribute('data-h');if(h){var m=S.ticks[sel]=S.ticks[sel]||{};if(m[h])delete m[h];else m[h]=1;if(!Object.keys(m).length)delete S.ticks[sel];save();render();return}
 var id=t.getAttribute('data-id');if(id){var i=find(id);if(i>-1){var x=S.tasks[sel][i];x.status=NEXT[x.status];save();render()}return}
 var dl=t.getAttribute('data-del');if(dl){var j=find(dl);if(j>-1){S.tasks[sel].splice(j,1);if(!S.tasks[sel].length)delete S.tasks[sel];save();render()}return}
 var f=t.getAttribute('data-f');if(f){filter=f;render();return}
 var hd=t.getAttribute('data-hdel');if(hd){S.habits=S.habits.filter(function(z){return z.id!==hd});save();render();return}
 switch(t.id){
  case 'gotoday':sel=today;vy=now.getFullYear();vm=now.getMonth();render();break;
  case 'addbtn':addTask();break;
  case 'carry':var src=S.tasks[sel]||[],keep=[],move=[];src.forEach(function(x){(x.status==='done'?keep:move).push(x)});
   if(keep.length)S.tasks[sel]=keep;else delete S.tasks[sel];(S.tasks[today]=S.tasks[today]||[]).push.apply(S.tasks[today],move);save();render();break;
  case 'gear':sheet=true;render();break;
  case 'close':sheet=false;render();break;
  case 'hadd':addHabit();break;
  case 'test':try{window.TM.testNotify()}catch(err){}break;
  case 'exact':try{window.TM.openExact()}catch(err){}break;
 }
});
app.addEventListener('keydown',function(e){if(e.key!=='Enter')return;if(e.target.id==='new'){e.preventDefault();addTask()}else if(e.target.id==='hnew'){e.preventDefault();addHabit()}});
// when the app comes back to the front on a new day, move "today" forward
document.addEventListener('visibilitychange',function(){if(document.hidden)return;var n=new Date(),k=key(n);if(k!==today){if(sel===today)sel=k;today=k;now=n;render()}else if(sheet)render()});
render();
})();
</script></body></html>
