plugins { id 'com.android.application' }

android {
    namespace 'com.taskmaster.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.taskmaster.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // Fixed key so new builds install as updates and keep your data
    signingConfigs {
        debug {
            storeFile file('taskmaster.jks')
            storePassword 'taskmaster'
            keyAlias 'taskmaster'
            keyPassword 'taskmaster'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release { minifyEnabled false; signingConfig signingConfigs.debug }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
